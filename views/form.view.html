<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <title>Interview Summary</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="#">
        <img src="assets/logo.png" height="25px" alt="logo">
        iWorQ Interview
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-item nav-link" href="#">Interviews</a>
          <a class="nav-item nav-link active" href="#">New Summary</a>
        </div>
      </div>
    </nav>
    <div class="container">
      <h1>Summary</h1>
      <p>Submit this form to make a record a summary of the interview</p>
      <form id="interviewSummary" method="POST" action="/submit">
        <div class="form-group">
          <label for="applicantName">Applicant Name</label>
          <input type="text" class="form-control" id="applicantName" name="name">
        </div>
        <div class="form-group">
          <label for="applicantEmail">Email address</label>
          <input type="email" class="form-control" id="applicantEmail" name="email" aria-describedby="emailHelp">
        </div>
        <div class="form-group">
          <label for="interviewDate">Interview Date</label>
          <input type="date" class="form-control" id="interviewDate" name="interview_date">
        </div>
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea class="form-control" id="notes" name="notes"></textarea>
        </div>
        <div class="form-group form-check">
          <input type="checkbox" class="form-check-input" id="recommendSecondInterview" name="second_interview">
          <label class="form-check-label" for="recommendSecondInterview">Recommend a 2nd interview</label>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script>
      $(function(){

        $('#interviewSummary').submit(function(event) {
          // event.preventDefault();

          var formData = $(this).serializeArray(); 
          console.log(formData);

        })
      });
    </script>
  </body>
</html>
